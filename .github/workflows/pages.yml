name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check diff whitespace
        run: git diff --check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Check JSON and JavaScript syntax
        run: |
          python3 -m json.tool site/github-pages/site-data.json >/dev/null
          python3 -m json.tool docs/projects/four-relay-xbee-wifi/ui/manifest.json >/dev/null
          node --check site/github-pages/app.js
          node --check docs/projects/four-relay-xbee-wifi/ui/app.js
          node --check scripts/browser_qa_prototype_packet.js

      - name: Build curated public site
        run: python3 scripts/build_github_pages.py --out build/github-pages

      - name: Audit public artifact
        env:
          # The private DOS-C sibling is not checked out in this public workflow.
          # Both scaffold entrypoints must explicitly report parity not evaluated.
          RNW_DOSC_PARITY_SCOPE: standalone
        run: |
          python3 scripts/audit_public_manifest.py
          python3 scripts/smoke_github_pages.py
          node scripts/browser_qa_prototype_packet.js build/github-pages
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/scaffold_audits -p 'test_*.py'
          python3 scripts/verify_scaffold.py

      - name: Prepare synthetic image test dependencies
        run: |
          python3 -c 'import platform, sys; assert sys.version_info[:2] == (3, 12) and platform.system() == "Linux" and platform.machine() == "x86_64", "Host-test wheel lock requires CPython 3.12 / Linux x86_64"'
          python3 -m venv "$RUNNER_TEMP/esp32-host-tests"
          "$RUNNER_TEMP/esp32-host-tests/bin/python" -m pip install --disable-pip-version-check --no-input --index-url https://pypi.org/simple --only-binary=:all: --no-deps --require-hashes -r .github/requirements-host-tests.txt
          "$RUNNER_TEMP/esp32-host-tests/bin/python" -m pip check
          printf '%s\n' "$RUNNER_TEMP/esp32-host-tests/bin" >> "$GITHUB_PATH"

      - name: Run host-side contract tests
        env:
          RNW_DOSC_PARITY_SCOPE: standalone
        run: |
          python3 -m py_compile scripts/*.py tests/four_relay_safe_core/run_host_tests.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/custom_wireless_protocol -p 'test_*.py'
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/lcd_bbs_menu -p 'test_*.py'
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/rnw_menu -p 'test_*.py'
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/esp32_gateway_tcp -p 'test_*.py'
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/live_bench -p 'test_*.py'
          python3 tests/four_relay_safe_core/run_host_tests.py

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/github-pages
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
