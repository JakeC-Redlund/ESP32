name: Firmware CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: firmware-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  esp-idf-build:
    name: ESP-IDF build (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: four-relay-xbee-wifi
            path: firmware/projects/four-relay-xbee-wifi
            adr: ADR-0002
          - project: espnow-bbs
            path: firmware/projects/espnow-bbs
            adr: ADR-0003
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build ESP-IDF project
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32
          path: ${{ matrix.path }}
